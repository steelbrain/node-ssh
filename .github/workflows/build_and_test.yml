name: build_and_test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node.js LTS lines
        node: [ 22, 24, 26 ]

    container:
      image: node:${{ matrix.node }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: '**/node_modules'
          # node_modules holds node-pty built for one Node.js version, so key the cache by version
          key: ${{ runner.os }}-node${{ matrix.node }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node${{ matrix.node }}-yarn-

      # node:26 and later images no longer include Yarn
      - name: Install Yarn
        run: command -v yarn || npm install -g yarn@1.22.22

      - name: Packager Version
        run: yarn --version

      - name: Install Dependencies
        run: yarn

      - name: Lint sources
        run: yarn lint

      - name: Test
        run: yarn test
